name: 매일 공구 모아

on:
  schedule:
    # UTC 기준입니다. 23:10 UTC = 다음날 08:10 한국시간 (매일)
    # 영어신문(7시대)과 겹치지 않게 8시 넘어서 돕니다.
    - cron: "10 23 * * *"
    # 첫 번째가 실패했을 때를 위한 재시도 (한국시간 8:40)
    # 이미 오늘 모았으면 아무것도 하지 않고 그냥 끝납니다.
    - cron: "40 23 * * *"
  workflow_dispatch:   # GitHub에서 수동 실행 버튼

permissions:
  contents: write      # 모은 공구 목록을 저장소에 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 오늘 이미 모았는지 확인
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          if grep -q "\"updated\": \"$TODAY" docs/gonggu/data/deals.json 2>/dev/null && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "오늘($TODAY) 공구는 이미 모았습니다. 건너뜁니다."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 파이썬 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 공구 모아서 카톡 보내기
        if: steps.check.outputs.skip != 'true'
        env:
          APIFY_TOKEN:         ${{ secrets.APIFY_TOKEN }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
        run: python send_gonggu.py

      - name: 모은 목록 저장하기
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gonggu/data/
          git diff --staged --quiet || git commit -m "공구 모아 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase
          git push
