name: 매일 스레드 세트

on:
  schedule:
    # UTC 기준입니다. 22:00 UTC = 다음 날 아침 7시 (한국시간)
    - cron: "0 22 * * *"
    # 첫 번째가 실패했을 때를 위한 재시도 (한국시간 7:40). 오늘 세트가 이미 있으면 그냥 끝납니다.
    - cron: "40 22 * * *"
  workflow_dispatch:   # GitHub에서 수동 실행 버튼

permissions:
  contents: write      # 만든 HTML을 저장소에 커밋하기 위해 필요

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 오늘 세트가 이미 있는지 확인
        id: check
        run: |
          DAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          if [ -f "docs/threads-daily/$DAY.html" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "오늘($DAY) 세트가 이미 있습니다. 건너뜁니다."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 파이썬 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 오늘 세트 만들어서 카톡 보내기
        if: steps.check.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY:   ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:  ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          # 아래 둘은 선택. 있으면 '스친 글'을 스레드에 자동으로 올립니다.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_FOLLOW_TOPIC: ${{ vars.THREADS_FOLLOW_TOPIC }}
        run: python send_threads_daily.py

      - name: 만든 세트 저장하기
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/threads-daily/
          git diff --staged --quiet || git commit -m "오늘 스레드 세트 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase
          git push
