name: 매일 아침 영어신문

on:
  schedule:
    # UTC 기준입니다. 22:00 UTC = 다음날 07:00 한국시간
    # 0-4 = 일~목(UTC) → 월~금(한국) 아침
    - cron: "0 22 * * 0-4"
    # 첫 번째가 실패했을 때를 위한 재시도 (한국시간 7:25, 7:50)
    # 이미 오늘 신문이 있으면 아무것도 하지 않고 그냥 끝납니다.
    - cron: "25 22 * * 0-4"
    - cron: "50 22 * * 0-4"
  workflow_dispatch:   # GitHub에서 수동 실행 버튼

permissions:
  contents: write      # 만든 HTML을 저장소에 커밋하기 위해 필요

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 오늘 신문이 이미 있는지 확인
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          if [ -f "docs/$TODAY.html" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "오늘($TODAY) 신문이 이미 있습니다. 건너뜁니다."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 파이썬 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 브라우저 설치 (기사 영상 찾기용)
        if: steps.check.outputs.skip != 'true'
        run: python -m playwright install --with-deps chromium

      - name: 영어신문 만들어서 카톡 보내기
        if: steps.check.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
        run: python send_news.py

      - name: 만든 신문 저장하기
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "영어신문 $(date +'%Y-%m-%d')"
          git push
