<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>톡톡 자막</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gasoek+One&family=Bagel+Fat+One&family=Dokdo&family=East+Sea+Dokdo&family=Gaegu:wght@700&family=Yeon+Sung&family=Hi+Melody&family=Gugi&family=Nanum+Pen+Script&family=Sunflower:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f5f2fa; --panel:#ffffff; --ink:#1d1830; --muted:#6b6480; --line:#e3dcef;
  --accent:#e5337c; --accent-ink:#ffffff; --soft:#fce4ef; --stage:#241f30; --field:#faf8fd;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14111b; --panel:#1e1928; --ink:#f0ecf7; --muted:#a39bb5; --line:#342c44;
    --accent:#ff5498; --accent-ink:#1a0710; --soft:#3a1d2c; --stage:#0b0910; --field:#241e30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111b; --panel:#1e1928; --ink:#f0ecf7; --muted:#a39bb5; --line:#342c44;
  --accent:#ff5498; --accent-ink:#1a0710; --soft:#3a1d2c; --stage:#0b0910; --field:#241e30;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font:400 30px/1 "Black Han Sans",sans-serif;letter-spacing:.5px;color:var(--ink);-webkit-text-stroke:0}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:920px){.wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr)} .stage-col{position:sticky;top:12px;align-self:start}}
.stage{position:relative;background:var(--stage);border-radius:18px;padding:12px;display:flex;justify-content:center}
#cv{display:block;max-width:100%;max-height:64vh;width:auto;height:auto;border-radius:8px;touch-action:none;cursor:grab;background:#000}
.badge{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(20,16,28,.72);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap;pointer-events:none}
.transport{display:flex;align-items:center;gap:12px;margin-top:12px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.tc{font:500 14px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
.timeline{flex:1;min-width:0}
#scrub{width:100%;accent-color:var(--accent);margin:0}
.lanes{position:relative;height:22px;margin-top:4px;border-radius:6px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.lane{position:absolute;top:3px;bottom:3px;border-radius:4px;border:0;padding:0;opacity:.55}
.lane.on{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}
.edit-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.edit-head h2{font:400 22px "Black Han Sans",sans-serif;margin:0}
.edit-head div{display:flex;gap:8px;flex-wrap:wrap}
#list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.open{border-color:var(--accent)}
.card-head{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer}
.card-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tm{font:500 12px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted);flex:none;min-width:78px}
.prev{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tag{flex:none;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.card-body{padding:4px 14px 14px;display:grid;gap:12px}
textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:10px 12px;font-size:17px;line-height:1.35}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.3px;margin-bottom:5px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:7px 9px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:3px}
.timefield{display:flex;gap:6px}
.timefield button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;font-size:13px}
.del{justify-self:start;border:0;background:none;color:var(--accent);font-weight:500;padding:4px 0}
.overlay{position:fixed;inset:0;background:rgba(12,9,18,.6);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border-radius:18px;padding:22px;width:min(420px,100%);display:grid;gap:14px;max-height:92vh;overflow:auto}
.dialog h3{margin:0;font:400 22px "Black Han Sans",sans-serif}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.dialog video{width:100%;max-height:50vh;border-radius:10px;background:#000}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<header class="top">
  <div class="brand"><b>톡톡 <i>자막</i></b><span>쇼츠 영상에 불꽃·팡·형광펜 글씨 효과 넣기</span></div>
  <div class="actions">
    <label class="btn" for="file">영상 불러오기</label>
    <input id="file" type="file" accept="video/*" hidden>
    <button id="exportBtn" class="btn primary" type="button">완성 영상 저장</button>
  </div>
</header>

<main class="wrap">
  <section class="stage-col">
    <div class="stage">
      <canvas id="cv" width="1080" height="1920" aria-label="자막 미리보기"></canvas>
      <div id="demoBadge" class="badge">샘플 배경이에요 · 영상을 불러오면 바뀌어요</div>
    </div>
    <div class="transport">
      <button id="playBtn" class="play" type="button" aria-label="재생"></button>
      <div class="timeline">
        <input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="재생 위치">
        <div id="lanes" class="lanes"></div>
      </div>
      <span id="tc" class="tc">0.0 / 10.0</span>
    </div>
    <p class="hint">미리보기의 자막을 손가락이나 마우스로 끌면 위치가 바뀌어요.</p>
  </section>

  <section class="edit-col">
    <div class="edit-head">
      <h2>자막 목록</h2>
      <div>
        <button id="resetBtn" class="btn ghost" type="button">예시로 되돌리기</button>
        <button id="addBtn" class="btn" type="button">+ 지금 위치에 자막</button>
      </div>
    </div>
    <div id="list"></div>
  </section>
</main>

<div id="exportOverlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h3 id="exTitle">영상 만드는 중</h3>
    <div id="exWorking">
      <p>영상을 처음부터 끝까지 재생하면서 녹화해요. 이 화면을 켜둔 채로 기다려 주세요.</p>
      <div class="bar" style="margin-top:12px"><i id="exBar"></i></div>
    </div>
    <div id="exDone" hidden>
      <video id="exVideo" controls playsinline></video>
      <p id="exInfo"></p>
    </div>
    <div class="btns">
      <button id="exCancel" class="btn" type="button">취소</button>
      <button id="exSave" class="btn primary" type="button" hidden>파일로 저장</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 1080, H = 1920;

const FONTS = ['Black Han Sans','Do Hyeon','Jua','Gasoek One','Bagel Fat One','Dokdo','East Sea Dokdo','Gaegu','Yeon Sung','Hi Melody','Gugi','Nanum Pen Script','Sunflower'];
const BOLD = new Set(['Gaegu','Sunflower']);
const STYLES = {
  fire:     {name:'불꽃',        font:'Black Han Sans', c1:'#ff2a1a', c2:'#4a0008', l1:'글자색', l2:'바깥 테두리', lane:'#ff5a1f'},
  pop:      {name:'한 글자씩 팡', font:'Do Hyeon',       c1:'#ffffff', c2:'#111111', l1:'글자색', l2:'테두리',     lane:'#8f7cff'},
  boom:     {name:'펑! 등장',     font:'Do Hyeon',       c1:'#ffffff', c2:'#111111', l1:'글자색', l2:'테두리',     lane:'#ffb300'},
  comic:    {name:'만화 집중선',  font:'Dokdo',          c1:'#ff2e93', c2:'#ffffff', l1:'글자색', l2:'테두리·집중선', lane:'#ff2e93'},
  outline:  {name:'기본 테두리',  font:'Do Hyeon',       c1:'#111111', c2:'#ffffff', l1:'글자색', l2:'테두리',     lane:'#7a8699'},
  highlight:{name:'형광펜',       font:'Do Hyeon',       c1:'#111111', c2:'#ffe94d', l1:'글자색', l2:'형광펜 색',  lane:'#e6cf00'},
  sparkle:  {name:'반짝 강조',    font:'Black Han Sans', c1:'#111111', c2:'#ffffff', l1:'글자색', l2:'테두리',     lane:'#2fb3a0'},
};
const SAMPLE = [
  ['4살이\n구구단을\n안다고?','fire',0,1.6,.5,.33,125],
  ['넘버블럭스\n보여주고','pop',1.6,2.7,.5,.36,110],
  ['딱!\n5분만','boom',2.7,3.7,.5,.4,125],
  ['큐브와\n놀면 돼요','comic',3.7,4.9,.52,.4,150],
  ['어떤 영상보고','outline',4.9,5.9,.5,.72,92],
  ['큐브로 어떻게\n해야하는지','outline',5.9,6.9,.5,.72,92],
  ['활용법\n싹~\n정리했어요!','sparkle',6.9,7.9,.5,.7,105],
  ['1-100카드랑도\n찰떡이니','highlight',7.9,8.9,.5,.72,88],
  ['꼭\n활용해\n보세요!','sparkle',8.9,10,.5,.68,120],
];
let uid = 1;
const mk = ([text,style,start,end,x,y,size]) => ({id:uid++, text, style, start, end, x, y, size, font:STYLES[style].font, c1:STYLES[style].c1, c2:STYLES[style].c2});
let caps;
try { const s = JSON.parse(localStorage.getItem('ttcaption.v1')||'null'); if (Array.isArray(s) && s.length) { caps = s.map(c => ({...c, id:uid++})); } } catch(e) {}
if (!caps) caps = SAMPLE.map(mk);
let sel = caps[0] ? caps[0].id : null;
let saveTimer;
const persist = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem('ttcaption.v1', JSON.stringify(caps.map(({_bbox,id,...c}) => c))); } catch(e) {} }, 300); };

// ---------- math ----------
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const rnd = n => { const x = Math.sin(n*12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const eOutCubic = x => 1 - Math.pow(1-x, 3);
const eOutBack = x => { const c1 = 1.70158, c3 = c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const eOutBounce = x => { const n=7.5625, d=2.75;
  if (x < 1/d) return n*x*x; if (x < 2/d) return n*(x-=1.5/d)*x+.75; if (x < 2.5/d) return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375; };
const shade = (hex, amt) => { const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return `rgb(${r},${g},${b})`; };

// ---------- time / playback ----------
const video = document.createElement('video');
video.playsInline = true; video.loop = true; video.preload = 'auto';
let hasVideo = false, dur = 10, demoT = 0, demoPlaying = false, demoStamp = 0;
let exporting = null;
function now() {
  if (hasVideo) return video.currentTime || 0;
  if (demoPlaying) {
    let t = (performance.now() - demoStamp) / 1000;
    if (exporting) t = Math.min(t, dur); else t %= dur;
    demoT = t;
  }
  return demoT;
}
const isPlaying = () => hasVideo ? !video.paused : demoPlaying;
function play() { if (hasVideo) { if (audio) audio.ctx.resume(); video.play().catch(()=>{}); } else { demoStamp = performance.now() - demoT*1000; demoPlaying = true; } }
function pause() { if (hasVideo) video.pause(); else { now(); demoPlaying = false; } }
function seek(t) { t = clamp(t, 0, dur); if (hasVideo) video.currentTime = t; else { demoT = t; demoStamp = performance.now() - t*1000; } }

// ---------- text layout & glyph drawing ----------
function fontStr(c, fs) { return `${BOLD.has(c.font)?700:400} ${fs}px "${c.font}", "Black Han Sans", sans-serif`; }
function layout(c, fs) {
  ctx.font = fontStr(c, fs);
  const lines = c.text.split('\n'), lh = fs*1.14;
  const cx = c.x*W, cy = c.y*H, top = cy - lh*lines.length/2 + lh/2;
  const glyphs = [], lineW = [], lineY = []; let maxW = 0, gi = 0;
  lines.forEach((ln, li) => {
    const chars = [...ln], w = ctx.measureText(ln).width, y = top + li*lh;
    lineW.push(w); lineY.push(y); maxW = Math.max(maxW, w);
    const x0 = cx - w/2;
    chars.forEach((ch, ci) => {
      const pre = ctx.measureText(chars.slice(0,ci).join('')).width, cw = ctx.measureText(ch).width;
      if (ch.trim()) glyphs.push({ch, x:x0+pre+cw/2, y, li, gi:gi++});
    });
  });
  return {glyphs, lineW, lineY, cx, cy, fs, bbox:{x:cx-maxW/2, y:top-lh/2, w:maxW, h:lh*lines.length}};
}
const ONE = () => ({});
function drawGlyphs(L, tf, layers) {
  const base = ctx.globalAlpha;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  for (const layer of layers) {
    ctx.save();
    if (layer.shadow) { [ctx.shadowColor, ctx.shadowBlur, ctx.shadowOffsetX, ctx.shadowOffsetY] = layer.shadow; }
    for (const g of L.glyphs) {
      const T = tf(g), a = T.a ?? 1, s = T.s ?? 1;
      if (a <= 0 || s <= 0) continue;
      ctx.save();
      ctx.globalAlpha = base * clamp(a);
      ctx.translate(g.x + (T.dx||0), g.y + (T.dy||0));
      if (T.r) ctx.rotate(T.r);
      if (s !== 1) ctx.scale(s, s);
      if (layer.stroke) { ctx.lineWidth = layer.stroke; ctx.strokeStyle = layer.color; ctx.strokeText(g.ch, 0, 0); }
      else { ctx.fillStyle = layer.fill; ctx.fillText(g.ch, 0, 0); }
      ctx.restore();
    }
    ctx.restore();
  }
}

// ---------- decorative shapes ----------
function star(x, y, r, points=5, inner=.45) {
  ctx.beginPath();
  for (let i = 0; i < points*2; i++) { const rr = i%2 ? r*inner : r, a = -Math.PI/2 + i*Math.PI/points; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath();
}
function twinkle(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y-r);
  ctx.quadraticCurveTo(x, y, x+r, y); ctx.quadraticCurveTo(x, y, x, y+r);
  ctx.quadraticCurveTo(x, y, x-r, y); ctx.quadraticCurveTo(x, y, x, y-r); ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s*.35);
  ctx.bezierCurveTo(x - s*.9, y - s*.25, x - s*.35, y - s*.85, x, y - s*.35);
  ctx.bezierCurveTo(x + s*.35, y - s*.85, x + s*.9, y - s*.25, x, y + s*.35); ctx.closePath();
}
function rrect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2); ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function drawFlames(L, t, grow) {
  const {bbox:b, fs} = L;
  const n = Math.max(4, Math.round(b.w / (fs*.42)));
  const base = b.y + fs*.42;
  const layers = [['#d41b00', 1, .95], ['#ff7a00', .74, .8], ['#ffd83a', .46, .62]];
  layers.forEach(([col, k, wk], li) => {
    ctx.save(); ctx.fillStyle = col;
    if (li === 0) { ctx.shadowColor = 'rgba(255,80,0,.9)'; ctx.shadowBlur = fs*.35; }
    for (let i = 0; i < n; i++) {
      const fx = b.x + (i+.5)/n*b.w;
      const flick = .82 + .2*Math.sin(t*9 + i*2.1) + .1*Math.sin(t*23 + i*5.3);
      const h = fs*(.95 + .55*rnd(i+3)) * flick * k * grow;
      const wd = b.w/n*.78*wk;
      const sway = Math.sin(t*6 + i*1.7) * fs*.13 * k;
      ctx.beginPath();
      ctx.moveTo(fx-wd, base);
      ctx.bezierCurveTo(fx-wd, base-h*.45, fx+sway-wd*.35, base-h*.7, fx+sway, base-h);
      ctx.bezierCurveTo(fx+sway+wd*.35, base-h*.7, fx+wd, base-h*.45, fx+wd, base);
      ctx.closePath(); ctx.fill();
    }
    // side tongues around each line's ends
    L.lineW.forEach((lw, j) => {
      [-1, 1].forEach(side => {
        const x = L.cx + side*(lw/2 + fs*.05), y = L.lineY[j] + fs*.2;
        const h = fs*.55*k*grow*(.85 + .2*Math.sin(t*11 + j*3 + side));
        const wd = fs*.2*wk;
        ctx.beginPath(); ctx.moveTo(x - wd, y);
        ctx.quadraticCurveTo(x - wd*1.1 + side*fs*.05, y - h*.6, x + side*fs*.12, y - h);
        ctx.quadraticCurveTo(x + wd*1.1, y - h*.5, x + wd, y); ctx.closePath(); ctx.fill();
      });
    });
    ctx.restore();
  });
  // embers
  for (let k = 0; k < 10; k++) {
    const ph = (t*.9 + rnd(k)) % 1;
    const x = b.x + rnd(k+50)*b.w + Math.sin(t*3 + k)*fs*.1, y = b.y - ph*fs*1.6;

  }
  ctx.globalAlpha = 1;
  // stars on the flame tips
  [[.2, -.55], [.5, -.8], [.8, -.55]].forEach(([fx, fy], i) => {
    const pulse = (.8 + .25*Math.sin(t*8 + i*2)) * grow;
    ctx.save(); ctx.lineJoin = 'round';
    star(b.x + fx*b.w, b.y + fy*fs, fs*.22*pulse);
    ctx.lineWidth = fs*.07; ctx.strokeStyle = '#e01500'; ctx.stroke();
    ctx.fillStyle = '#fff36b'; ctx.fill(); ctx.restore();
  });
}

function drawBoom(L, tl) {
  const p = clamp(tl / .55); if (p >= 1) return;
  const {cx, cy, fs, bbox:b} = L;
  const R = Math.max(b.w, b.h)*.32 + fs*.35, ep = eOutCubic(p), grow = eOutCubic(clamp(p*2.2));
  ctx.save(); ctx.globalAlpha *= p < .55 ? 1 : 1 - (p-.55)/.45;
  const puffs = [];
  for (let i = 0; i < 11; i++) {
    const a = i/11*Math.PI*2 + rnd(i)*.4, d = R*ep*(.35 + .6*rnd(i+20));
    puffs.push([cx + Math.cos(a)*d, cy + Math.sin(a)*d*.8, fs*(.5 + .4*rnd(i+40))*grow*(1 - .35*p)]);
  }
  puffs.push([cx, cy, fs*.95*grow*(1-.3*p)]);
  ctx.fillStyle = '#ff8a00'; puffs.forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = '#ffcb2f'; puffs.forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x - r*.12, y - r*.12, r*.8, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = '#fff5bd'; puffs.forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x - r*.3, y - r*.3, r*.32, 0, Math.PI*2); ctx.fill(); });

  for (let i = 0; i < 12; i++) {
    const a = i/12*Math.PI*2 + .2;

    ctx.moveTo(cx + Math.cos(a)*R*(.7+ep*.5), cy + Math.sin(a)*R*(.7+ep*.5));
    ctx.lineTo(cx + Math.cos(a)*R*(.9+ep*.9), cy + Math.sin(a)*R*(.9+ep*.9)); ctx.stroke();
  }
  ctx.restore();
}

function drawBurst(L, t, c) {
  const {cx, cy, fs, bbox:b} = L, seed = Math.floor(t*10), n = 28;
  const rx = b.w/2 + fs*.4, ry = b.h/2 + fs*.35;
  ctx.save(); ctx.lineJoin = 'round';
  for (let i = 0; i < n; i++) {
    const a = i/n*Math.PI*2 + (rnd(seed*31+i)-.5)*.18;
    const dx = Math.cos(a), dy = Math.sin(a);
    const x0 = cx + dx*rx, y0 = cy + dy*ry;
    const len = fs*(.3 + .6*rnd(i + seed*7));
    const hw = fs*.045;
    ctx.beginPath();
    ctx.moveTo(x0 - dy*hw, y0 + dx*hw); ctx.lineTo(x0 + dx*len, y0 + dy*len); ctx.lineTo(x0 + dy*hw, y0 - dx*hw); ctx.closePath();
    ctx.lineWidth = fs*.05; ctx.strokeStyle = shade(c.c1, -.55); ctx.stroke();
    ctx.fillStyle = c.c2; ctx.fill();
  }
  ctx.restore();
  [[b.x - fs*.15, b.y + b.h*.8, .24, 0], [b.x + b.w + fs*.1, b.y + b.h*.9, .17, 1.3]].forEach(([x, y, s, ph]) => {
    const bob = Math.sin(t*5 + ph)*fs*.05;
    heart(x, y + bob, fs*s*1.6); ctx.lineWidth = fs*.05; ctx.strokeStyle = c.c2; ctx.stroke(); ctx.fillStyle = c.c1; ctx.fill();
  });
}

function drawTicks(x, y, ang, size, c1, c2) {
  ctx.save(); ctx.lineCap = 'round';
  [[size*.26, c2], [size*.12, c1]].forEach(([lw, col]) => {
    ctx.lineWidth = lw; ctx.strokeStyle = col;
    for (let k = -1; k <= 1; k++) {
      const a = ang + k*.55, r0 = size*.3, r1 = size*(k ? .8 : 1);
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a)*r0, y + Math.sin(a)*r0); ctx.lineTo(x + Math.cos(a)*r1, y + Math.sin(a)*r1); ctx.stroke();
    }
  });
  ctx.restore();
}

// ---------- caption renderer ----------
function drawCaption(c, t) {
  const s = W/1080, fs = c.size*s, tl = t - c.start, tail = c.end - t;
  const L = layout(c, fs); c._bbox = L.bbox;
  const {cx, cy} = L;
  ctx.save();
  ctx.globalAlpha = clamp(tail / .1);
  const txt = (tf, layers) => { ctx.font = fontStr(c, fs); drawGlyphs(L, tf, layers); };
  const around = (S, r=0, dx=0, dy=0) => { ctx.translate(cx+dx, cy+dy); ctx.rotate(r); ctx.scale(S, S); ctx.translate(-cx, -cy); };

  switch (c.style) {
  case 'fire': {
    const e = clamp(tl/.35), shake = tl < .4 ? (1 - tl/.4)*fs*.08 : 0, f = Math.floor(t*30);
    around(1 + .45*(1 - eOutBack(e)), 0, (rnd(f)-.5)*shake*2, (rnd(f+7)-.5)*shake*2);
    drawFlames(L, t, eOutCubic(clamp(tl/.3)));
    const g = ctx.createLinearGradient(0, -fs*.5, 0, fs*.5);
    g.addColorStop(0, shade(c.c1, .5)); g.addColorStop(.5, c.c1); g.addColorStop(1, shade(c.c1, -.35));
    txt(ONE, [{stroke:fs*.34, color:c.c2, shadow:['rgba(255,90,0,.85)', fs*.25, 0, 0]}, {stroke:fs*.15, color:'#ffffff'}, {fill:g}]);
    break;
  }
  case 'pop':
    txt(g => { const p = clamp((tl - g.gi*.055)/.28); return p <= 0 ? {a:0} : {a:p*2, s:eOutBack(p), dy:(1-eOutCubic(p))*fs*.25}; },
        [{stroke:fs*.24, color:c.c2, shadow:['rgba(0,0,0,.35)', fs*.12, 0, fs*.06]}, {fill:c.c1}]);
    break;
  case 'boom': {
    const p = clamp((tl - .22)/.3);
    if (p > 0) {
      ctx.save(); around(eOutBack(p), (1-p)*-.12);
      txt(ONE, [{stroke:fs*.24, color:c.c2, shadow:['rgba(0,0,0,.35)', fs*.12, 0, fs*.06]}, {fill:c.c1}]);
      ctx.restore();
    }
    drawBoom(L, tl);
    break;
  }
  case 'comic': {
    around(.35 + .65*eOutBack(clamp(tl/.3)));
    drawBurst(L, t, c);
    const step = Math.floor(t*8);
    txt(g => ({r:Math.sin(g.gi*1.9 + step*1.3)*.07, dy:Math.sin(g.gi*2.3 + step)*fs*.03}),
        [{stroke:fs*.32, color:shade(c.c1, -.45)}, {stroke:fs*.2, color:c.c2}, {fill:c.c1}]);
    break;
  }
  case 'outline':
    txt(g => { const p = clamp((tl - g.li*.08)/.22); return {a:p, dy:(1-eOutCubic(p))*fs*.35}; },
        [{stroke:fs*.22, color:c.c2, shadow:['rgba(0,0,0,.28)', fs*.1, 0, fs*.04]}, {fill:c.c1}]);
    break;
  case 'highlight': {
    L.lineW.forEach((lw, li) => {
      const p = clamp((tl - li*.12)/.28); if (p <= 0) return;
      const pad = fs*.22;
      ctx.save(); ctx.translate(cx, L.lineY[li]); ctx.rotate(-.025);
      rrect(-lw/2 - pad, -fs*.46, (lw + pad*2)*eOutCubic(p), fs*.92, fs*.22);
      ctx.lineWidth = fs*.09; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.fillStyle = c.c2; ctx.fill(); ctx.restore();
    });
    txt(g => { const p = clamp((tl - g.li*.12 - .08)/.2); return {a:p, s:.9 + .1*eOutBack(p)}; },
        [{stroke:fs*.14, color:'#ffffff'}, {fill:c.c1}]);
    break;
  }
  case 'sparkle': {
    txt(g => { const p = clamp((tl - g.li*.1)/.45); return {a:p*3, dy:-(1-eOutBounce(p))*fs*.9}; },
        [{stroke:fs*.26, color:c.c2, shadow:['rgba(0,0,0,.25)', fs*.1, 0, fs*.04]}, {fill:c.c1}]);
    const q = clamp((tl - .35)/.2);
    if (q > 0) {
      const b = L.bbox, k = (1 + .15*Math.sin(t*10))*q;
      drawTicks(b.x - fs*.1, b.y + fs*.05, -Math.PI*.75, fs*.75*k, c.c1, c.c2);
      drawTicks(b.x + b.w + fs*.1, b.y + fs*.05, -Math.PI*.25, fs*.75*k, c.c1, c.c2);
      drawTicks(b.x + b.w + fs*.05, b.y + b.h - fs*.1, Math.PI*.25, fs*.55*k, c.c1, c.c2);
      [[-.2, .55], [1.15, .45], [.1, 1.05]].forEach(([fx, fy], i) => {
        const r = fs*.2*q*(.4 + .6*Math.abs(Math.sin(t*4 + i*1.9)));
        twinkle(b.x + fx*b.w, b.y + fy*b.h, r); ctx.fillStyle = '#ffd21f'; ctx.fill();
      });
    }
    break;
  }
  }
  ctx.restore();
}

// ---------- background ----------
function drawDemo(t) {
  ctx.fillStyle = '#dcd5cc'; ctx.fillRect(0, 0, W, H);
  const tile = W/4.2; ctx.strokeStyle = '#c9c1b6'; ctx.lineWidth = W*.004;
  for (let x = -tile*.3; x < W; x += tile) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H*.62); ctx.stroke(); }
  for (let y = tile*.4; y < H*.62; y += tile) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const ty = H*.62;
  const g = ctx.createLinearGradient(0, ty, 0, H); g.addColorStop(0, '#fbfbf9'); g.addColorStop(1, '#e6e6e2');
  ctx.fillStyle = g; ctx.fillRect(0, ty, W, H - ty);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, ty, W, H*.008);
  const cols = ['#6b3fa0','#ff7a1a','#ffd21f','#ff7a1a','#e8203a','#ffd21f','#2e7de0','#2fb35a','#6b3fa0'];
  const n = 2 + Math.floor((t % dur)/dur * 8), sz = W*.1;

    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + sz*.9, y, sz*.1, sz);
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, sz, sz);

}

// ---------- frame loop ----------
const scrub = $('#scrub'), tc = $('#tc'), playBtn = $('#playBtn');
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
let lastPlaying = null, scrubbing = false;
function frame() {
  const t = now();
  if (hasVideo && video.readyState >= 2) ctx.drawImage(video, 0, 0, W, H);
  else if (!hasVideo) drawDemo(t);
  for (const c of caps) { c._bbox = null; if (t >= c.start && t < c.end) drawCaption(c, t); }
  if (!exporting) {
    const c = caps.find(c => c.id === sel);
    if (c && c._bbox) {
      const b = c._bbox, p = 18*W/1080;
      ctx.save(); ctx.setLineDash([16*W/1080, 10*W/1080]); ctx.lineWidth = 4*W/1080; ctx.strokeStyle = '#ff4f93';
      ctx.strokeRect(b.x - p, b.y - p, b.w + p*2, b.h + p*2); ctx.restore();
    }
  } else {
    $('#exBar').style.width = (clamp(t/dur)*100).toFixed(1) + '%';
    if (!hasVideo && t >= dur && exporting.rec.state === 'recording') exporting.rec.stop();
  }
  if (!scrubbing) scrub.value = t;
  tc.textContent = `${t.toFixed(1)} / ${dur.toFixed(1)}`;
  const pl = isPlaying();

  requestAnimationFrame(frame);
}

// ---------- fonts ----------
function ensureFont(c) { if (document.fonts && document.fonts.load) document.fonts.load(`${BOLD.has(c.font)?700:400} 60px "${c.font}"`, c.text || '가').catch(()=>{}); }
caps.forEach(ensureFont);

// ---------- editor UI ----------
const list = $('#list'), lanes = $('#lanes');

const fmt = n => (+n).toFixed(1);
function renderLanes() {

  caps.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lane' + (c.id === sel ? ' on' : '');
    b.style.left = (c.start/dur*100) + '%'; b.style.width = Math.max(.5, (c.end - c.start)/dur*100) + '%';

}
function select(id, jump) {
  sel = id; const c = caps.find(c => c.id === id);
  if (c && jump) { pause(); seek(c.start + Math.min(.6, (c.end - c.start)*.6)); }
  renderList();
}
function renderList() {

}
$('#addBtn').onclick = () => {

playBtn.onclick = () => isPlaying() ? pause() : play();
scrub.addEventListener('input', () => { scrubbing = true; seek(parseFloat(scrub.value)); });

// drag captions on the canvas
let drag = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)/r.width*W, (e.clientY - r.top)/r.height*H]; };
cv.addEventListener('pointerdown', e => {
  if (exporting) return;
  const [x, y] = toCanvas(e), pad = 30*W/1080;
  const hit = [...caps].reverse().find(c => c._bbox && x > c._bbox.x - pad && x < c._bbox.x + c._bbox.w + pad && y > c._bbox.y - pad && y < c._bbox.y + c._bbox.h + pad);
  if (!hit) return;

});

// ---------- export ----------
let audio = null;

  if (!mime || !cv.captureStream) { toast('이 브라우저는 영상 저장을 지원하지 않아요. 크롬에서 열어 주세요.'); return; }
  pause();
  const stream = cv.captureStream(30);
  if (hasVideo) { const a = ensureAudio(); if (a) { await a.ctx.resume(); a.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); } }
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:8e6});
  const chunks = [];
  exporting = {rec, cancelled:false};
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const was = exporting; exporting = null;
    stream.getVideoTracks().forEach(t => t.stop());
    video.loop = true; video.onended = null; pause();
    if (was.cancelled) { ov.hidden = true; return; }
    const type = mime.split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, {type});
    if (result) URL.revokeObjectURL(result.url);
    result = {blob, url:URL.createObjectURL(blob), name:`톡톡자막-${new Date().toISOString().slice(0,10)}.${ext}`};
    $('#exTitle').textContent = '영상이 완성됐어요';
    $('#exWorking').hidden = true; $('#exDone').hidden = false; $('#exSave').hidden = false;
    $('#exCancel').textContent = '닫기';
    $('#exVideo').src = result.url;
    $('#exInfo').textContent = `${ext.toUpperCase()} · ${(blob.size/1048576).toFixed(1)}MB${ext === 'webm' ? ' · 휴대폰에 따라 webm이 안 열리면 크롬에서 다시 저장해 보세요' : ''}`;
  };
  $('#exTitle').textContent = '영상 만드는 중';
  $('#exWorking').hidden = false; $('#exDone').hidden = true; $('#exSave').hidden = true; $('#exCancel').textContent = '취소';
  $('#exBar').style.width = '0';
  ov.hidden = false;
  if (hasVideo) {
    video.loop = false;
    await new Promise(r => { video.onseeked = () => { video.onseeked = null; r(); }; video.currentTime = 0; });
    video.onended = () => { if (exporting && rec.state === 'recording') rec.stop(); };
    rec.start(250);
    video.play().catch(() => { toast('재생을 시작하지 못했어요. 다시 눌러 주세요.'); exporting.cancelled = true; rec.stop(); });
  } else {
    demoT = 0; rec.start(250); demoStamp = performance.now(); demoPlaying = true;
  }
};
$('#exCancel').onclick = () => {
  if (exporting) { exporting.cancelled = true; if (exporting.rec.state === 'recording') exporting.rec.stop(); else { exporting = null; ov.hidden = true; } }
  else ov.hidden = true;
};
$('#exSave').onclick = async () => {
  if (!result) return;
  try {
    const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (d) { await d.save({filename:result.name, data:result.blob}); toast('저장했어요'); return; }
  } catch (e) {
    if (e && e.code === 'declined') { toast('저장을 취소했어요'); return; }
    if (e && e.code === 'rate_limited') { toast('잠시 후 다시 눌러 주세요'); return; }
  }
  const a = document.createElement('a'); a.href = result.url; a.download = result.name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('저장을 시작했어요. 안 되면 위 영상을 길게 눌러 저장하세요.');
};

let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2600); }

renderList();
requestAnimationFrame(frame);
})();
</script>
