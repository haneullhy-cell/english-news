<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>넘버블록스 큐브 놀이 자료 · 말하는수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#111318;--dim:#5B6472;--hl:#FFE24A;--lime:#B6F24A;--line:#C7CED6}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#EFF1F4;color:var(--ink);line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;line-height:1.3;margin:0 0 4px;font-weight:900}
.sub{color:var(--dim);font-size:14px;margin:0 0 18px}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:16px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 6px;font-weight:900}
.card p{margin:0 0 12px;font-size:14px;color:#333}
.btn{display:block;text-align:center;text-decoration:none;color:var(--ink);font-weight:900;padding:13px 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--lime);box-shadow:2px 2px 0 var(--ink);font-size:16px;margin-top:8px}
.btn.ghost{background:#fff}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.tip{background:var(--hl);border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:4px}
.foot{text-align:center;font-size:12px;color:var(--dim);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1>넘버블록스 큐브 놀이 자료</h1>
  <p class="sub">말하는수학 · 무료 나눔</p>

  <div class="card">
    <h2>100판 (한 칸 2cm)</h2>
    <p>연결큐브가 칸에 딱 들어가요.</p>
    <a class="btn" href="hundred_2cm.pdf" download>100판 한 장짜리 받기</a>
    <a class="btn ghost" href="hundred_2cm_2pages.pdf" download>100판 두 장짜리 받기</a>
  </div>

  <div class="card">
    <h2>얼굴 스티커 1~10 (2×2cm)</h2>
    <p>라벨지에 뽑아 큐브에 붙여요. 집에서만 쓰세요.</p>
    <a class="btn" href="faces_2cm.pdf" download>얼굴 스티커 받기</a>
  </div>

  <div class="tip"><b>인쇄</b>는 꼭 실제 크기(100%)로. "페이지에 맞춤"이면 줄어들어요.</div>
  <p class="foot">© 말하는수학 · 재판매·재배포는 안 돼요</p>
</div>
</body>
</html>
